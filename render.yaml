# Render Blueprint for DiffProve
# See docs/deploy-render.md for step-by-step deployment instructions.

databases:
  # PostgreSQL for installation metadata, repo config overrides, and run history.
  # Note: free plan expires after 30 days and has limited uptime; use starter or higher for production.
  - name: diffprove-db
    databaseName: diffprove
    user: diffprove
    plan: free

services:
  # Redis for BullMQ verification queue and base-commit snapshot cache.
  # Note: starter or higher is recommended for production persistence.
  - type: keyvalue
    name: diffprove-redis
    plan: free
    maxmemoryPolicy: noeviction
    # Empty allow list restricts access to services inside your Render private network.
    ipAllowList: []

  # GitHub App webhook server, dashboard API, and in-process BullMQ worker.
  # Must use starter (or higher): the free tier sleeps after 15 minutes of inactivity,
  # which pauses the BullMQ worker and causes GitHub webhook timeouts.
  - type: web
    name: diffprove-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diffprove-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: diffprove-db
          property: connectionString
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: E2B_API_KEY
        sync: false

  # Next.js web dashboard; proxies /api/* over Render's private network to diffprove-api.
  - type: web
    name: diffprove-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start -w apps/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: API_PROXY_HOSTPORT
        fromService:
          type: web
          name: diffprove-api
          property: hostport
